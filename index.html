<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Generatore Excel - Rilievo Pozzetti</title>
    <!-- Tailwind CSS per lo styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS per la generazione del file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* grigio chiaro */
            -webkit-tap-highlight-color: transparent;
        }
        
        .screen {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .screen.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stili per migliorare l'usabilità mobile (pulsanti grandi, input touch-friendly) */
        input, select, textarea {
            font-size: 16px !important; /* Previene lo zoom automatico su iOS */
        }

        .bottom-bar {
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-dvh h-dvh w-full overflow-hidden flex justify-center bg-slate-100 text-slate-800">

    <!-- Container principale, simula lo schermo di uno smartphone su desktop, full su mobile -->
    <div class="w-full max-w-md h-full bg-white relative shadow-xl overflow-hidden flex flex-col">
        
        <!-- SCHERMATA 1: Inizio -->
        <div id="screen-1" class="screen active h-full justify-center p-6 text-center">
            <div class="mb-8">
                <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-slate-800 mb-2">Rilievo Pozzetti</h1>
                <p class="text-slate-500 mb-10">Crea e scarica rapidamente i tuoi report in formato Excel direttamente dal campo.</p>
            </div>
            
            <button onclick="goToScreen(2)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-colors active:scale-95 text-lg">
                Genera file Excel
            </button>
        </div>

        <!-- SCHERMATA 2: Dati Generali -->
        <div id="screen-2" class="screen h-full flex-col">
            <!-- Header -->
            <div class="bg-blue-600 text-white p-4 flex items-center shadow-md shrink-0">
                <button onclick="goToScreen(1)" class="mr-4 p-2 rounded-full hover:bg-blue-700 active:bg-blue-800">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <h2 class="text-xl font-semibold">Dati Generali</h2>
            </div>

            <!-- Content -->
            <div class="flex-1 p-6 overflow-y-auto">
                <p class="text-sm text-slate-500 mb-6">Inserisci le informazioni di base per il rilievo odierno.</p>
                
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Location</label>
                    <input type="text" id="input-location" placeholder="Es. Cantiere Roma Nord" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
                
                <div class="mb-8">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Numero Collettori</label>
                    <input type="number" id="input-collettori" placeholder="Es. 4" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>
            </div>

            <!-- Footer (Pulsante Avanti) -->
            <div class="p-4 shrink-0 bg-white border-t border-slate-100 bottom-bar">
                <button onclick="saveGeneralInfoAndGoNext()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-colors active:scale-95 text-lg">
                    Avanti
                </button>
            </div>
        </div>

        <!-- SCHERMATA 3: Inserimento Pozzetti -->
        <div id="screen-3" class="screen h-full flex-col">
            <!-- Header -->
            <div class="bg-blue-600 text-white p-4 flex items-center shadow-md shrink-0">
                <button onclick="goToScreen(2)" class="mr-4 p-2 rounded-full hover:bg-blue-700 active:bg-blue-800">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <div class="flex flex-col">
                    <h2 class="text-xl font-semibold">Pozzetti</h2>
                    <span id="header-subtitle" class="text-xs opacity-80">Location...</span>
                </div>
            </div>

            <!-- Content scrollable -->
            <div class="flex-1 overflow-y-auto p-4 bg-slate-50">
                
                <!-- Form inserimento -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
                    <h3 class="font-semibold text-slate-800 mb-4 border-b pb-2">Nuovo Pozzetto</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Numero / ID</label>
                            <input type="text" id="input-pozzetto-num" placeholder="Es. P-01" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Valore</label>
                            <select id="input-pozzetto-val" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 appearance-none">
                                <option value="" disabled selected>Scegli...</option>
                                <option value="a">Valore A</option>
                                <option value="b">Valore B</option>
                                <option value="c">Valore C</option>
                                <option value="d">Valore D</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-xs font-medium text-slate-500 mb-1">Note Libere</label>
                        <textarea id="input-pozzetto-note" rows="2" placeholder="Eventuali anomalie, dettagli..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                    </div>

                    <button onclick="addPozzetto()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-xl transition-colors flex justify-center items-center active:scale-95">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Salva in lista
                    </button>
                </div>

                <!-- Lista Pozzetti Aggiunti -->
                <div class="mb-4 flex justify-between items-end">
                    <h3 class="font-semibold text-slate-800 text-lg">Elementi aggiunti</h3>
                    <span id="counter-pozzetti" class="text-xs font-medium bg-blue-100 text-blue-800 px-2 py-1 rounded-full">0 totali</span>
                </div>
                
                <div id="lista-pozzetti" class="space-y-3 pb-8">
                    <!-- Placeholder per lista vuota -->
                    <div id="empty-state" class="text-center py-8 text-slate-400">
                        <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p class="text-sm">Nessun pozzetto inserito.</p>
                    </div>
                    <!-- Gli elementi verranno aggiunti qui tramite JS -->
                </div>
            </div>

            <!-- Bottone Download -->
            <div class="p-4 shrink-0 bg-white border-t border-slate-100 bottom-bar">
                <button onclick="downloadExcel()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg transition-colors flex justify-center items-center active:scale-95 text-lg">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Scarica Excel
                </button>
            </div>
        </div>

        <!-- Custom Toast per notifiche (anzichè alert) -->
        <div id="toast" class="toast">Messaggio</div>
    </div>

    <script>
        // Stato dell'applicazione
        const appState = {
            location: "",
            collettori: "",
            pozzetti: []
        };

        // Utility: Gestione navigazione schermate
        function goToScreen(screenNumber) {
            // Nasconde tutte le schermate
            document.querySelectorAll('.screen').forEach(el => {
                el.classList.remove('active');
            });
            // Mostra quella richiesta
            document.getElementById(`screen-${screenNumber}`).classList.add('active');
        }

        // Utility: Mostra messaggi a schermo
        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.style.backgroundColor = isError ? "#ef4444" : "#10b981"; // Rosso o Verde
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // Logica Schermata 2 -> 3
        function saveGeneralInfoAndGoNext() {
            const locInput = document.getElementById('input-location').value.trim();
            const colInput = document.getElementById('input-collettori').value.trim();

            if (!locInput || !colInput) {
                showToast("Compila tutti i campi prima di procedere.", true);
                return;
            }

            appState.location = locInput;
            appState.collettori = colInput;

            // Aggiorna header schermata 3
            document.getElementById('header-subtitle').textContent = `${locInput} - Coll: ${colInput}`;
            
            goToScreen(3);
        }

        // Logica aggiunta Pozzetto
        function addPozzetto() {
            const numInput = document.getElementById('input-pozzetto-num');
            const valSelect = document.getElementById('input-pozzetto-val');
            const noteInput = document.getElementById('input-pozzetto-note');

            const numero = numInput.value.trim();
            const valore = valSelect.value;
            const note = noteInput.value.trim();

            if (!numero) {
                showToast("Inserisci il numero del pozzetto.", true);
                return;
            }
            if (!valore) {
                showToast("Seleziona un valore dalla tendina.", true);
                return;
            }

            // Aggiungi allo stato
            const nuovoPozzetto = { numero, valore: valore.toUpperCase(), note };
            appState.pozzetti.push(nuovoPozzetto);

            // Aggiorna UI
            renderListaPozzetti();
            
            // Pulisci form
            numInput.value = "";
            valSelect.value = "";
            noteInput.value = "";
            numInput.focus();

            showToast("Pozzetto salvato!");
        }

        // Renderizza la lista nella UI
        function renderListaPozzetti() {
            const listaContainer = document.getElementById('lista-pozzetti');
            const emptyState = document.getElementById('empty-state');
            const counter = document.getElementById('counter-pozzetti');

            counter.textContent = `${appState.pozzetti.length} totali`;

            if (appState.pozzetti.length > 0) {
                emptyState.style.display = 'none';
            } else {
                emptyState.style.display = 'block';
            }

            // Pulisce la lista attuale eccetto l'empty state
            Array.from(listaContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            // Ricrea gli elementi
            // Iteriamo al contrario per mostrare l'ultimo aggiunto in cima
            [...appState.pozzetti].reverse().forEach((p, index) => {
                const originalIndex = appState.pozzetti.length - 1 - index; // Serve se volessimo implementare l'eliminazione
                
                const item = document.createElement('div');
                item.className = 'bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex flex-col relative';
                
                let noteHtml = '';
                if(p.note) {
                    noteHtml = `<p class="text-xs text-slate-500 mt-2 bg-slate-50 p-2 rounded">${p.note}</p>`;
                }

                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center">
                            <span class="bg-blue-100 text-blue-700 font-bold px-2 py-1 rounded text-sm mr-3">${p.numero}</span>
                            <span class="font-semibold text-slate-700">Val: ${p.valore}</span>
                        </div>
                        <button onclick="removePozzetto(${originalIndex})" class="text-slate-400 hover:text-red-500 p-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    ${noteHtml}
                `;
                listaContainer.appendChild(item);
            });
        }

        // Funzionalità extra per migliorare l'UX: rimuovi pozzetto
        function removePozzetto(index) {
            appState.pozzetti.splice(index, 1);
            renderListaPozzetti();
            showToast("Pozzetto rimosso");
        }

        // Generazione File Excel
        function downloadExcel() {
            if (appState.pozzetti.length === 0) {
                showToast("Aggiungi almeno un pozzetto prima di scaricare.", true);
                return;
            }

            try {
                showToast("Generazione Excel in corso...");

                // Prepara i dati come Array of Arrays per SheetJS
                const ws_data = [
                    // Intestazione Dati Generali
                    ["RILIEVO POZZETTI"],
                    ["Data:", new Date().toLocaleDateString('it-IT')],
                    ["Location:", appState.location],
                    ["Numero collettori:", appState.collettori],
                    [], // Riga vuota di separazione
                    // Intestazioni di colonna per la tabella pozzetti
                    ["Numero Pozzetto", "Valore", "Note Libere"]
                ];

                // Aggiungi le righe dei pozzetti
                appState.pozzetti.forEach(p => {
                    ws_data.push([p.numero, p.valore, p.note || ""]);
                });

                // Crea il worksheet
                const ws = XLSX.utils.aoa_to_sheet(ws_data);

                // Styling base delle larghezze colonne (opzionale)
                ws['!cols'] = [
                    { wch: 15 }, // Colonna A (Numero)
                    { wch: 10 }, // Colonna B (Valore)
                    { wch: 40 }  // Colonna C (Note)
                ];

                // Crea il workbook
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Dati Pozzetti");

                // Nome file dinamico
                const safeLocationName = appState.location.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const fileName = `Rilievo_${safeLocationName}_${new Date().getTime()}.xlsx`;

                // Attiva il download
                XLSX.writeFile(wb, fileName);

            } catch (error) {
                console.error("Errore generazione Excel:", error);
                showToast("Errore durante la generazione del file.", true);
            }
        }

    </script>
</body>
</html>
